  to = "/404.html"
  status = 404
  force = true
# Pre-publicity sweep, 14 Aug: the templates/ subfolder (engagement-quote
# template and its css/js/readme) was live but unlinked, an internal
# business-development artefact with no reason to be fetchable. The splat
# covers the whole subfolder; nothing the site loads lives under it.
[[redirects]]
  from = "/design-system/templates/*"
  to = "/404.html"
  status = 404
  force = true

# SPA fallback. Netlify serves real files first and only applies this rule for
# paths that do not exist, so /data/tools.json and /css/* still resolve normally.
# Do not add force = true here or it will shadow the data file and break the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
