# Netlify config per PRD section 9. No build step: static files served as-is.

[build]
  publish = "."

# X-Frame-Options DENY used to sit on "/*" (every path). Batch I adds embed
# mode (BUILD-PLAN 10.11), which needs the opposite of DENY on exactly one
# path: framable, but only from kaipability.com. X-Frame-Options has no
# per-origin allow-list, so it cannot express that, and Netlify header rules
# only ever add headers for a matching path, they cannot remove one a wider
# rule already set. So DENY is scoped explicitly to the app's own pages, all
# of which serve index.html, the single-page app shell: "/" and "/index.html"
# (the public directory, per BUILD-PLAN 10.12) and "/x" (curator, the hidden
# staff entry point). "/*" and /embed.html are left off entirely; embed.html
# gets the scoped Content-Security-Policy rule below instead.
[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/x"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Strict CSP (PRD-REGISTER section 10). No 'unsafe-inline' for scripts:
    # the two inline boot scripts on the whole site (index.html's and
    # embed.html's theme-boot/entry scripts; why-register.html reuses
    # index.html's script byte for byte, so it needs no third hash) are
    # allow-listed by sha256 instead. Recompute with:
    #   node -e "const c=require('crypto');const fs=require('fs');const h=fs.readFileSync('index.html','utf8').match(/<script>([\s\S]*?)<\/script>/)[1];console.log(c.createHash('sha256').update(h).digest('base64'))"
    # (swap the file/tag match for embed.html's inline module script) and
    # replace the hash below if either boot script ever changes; a stale
    # hash blocks the script entirely rather than degrading gracefully.
    # (Phase 15.4: the shared boot script also stamps js-boot on the root to
    # hide the #static-root crawler block before first paint, per the
    # amended section 18 clause; the hash above is that updated script's.)
    # img-src allows https: for the DuckDuckGo/Google favicon proxies
    # (PRD section 8) plus data: for any inline-encoded images; connect-src
    # is 'self' only, since the app only ever fetches its own data/*.json.
    # frame-ancestors is deliberately absent here (it does not fall back to
    # default-src, unlike the other omitted directives). /embed.html gets its
    # own complete copy of this policy with frame-ancestors appended, because
    # Netlify replaces a same-named header wholesale for the narrower path
    # (confirmed on the PR 3 deploy preview); keep the two values in step.
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'sha256-XRCkNlfal/u9MDRDFatwZ8fbo9S8jzgsybjnonliY4Q=' 'sha256-tXEPFiTeuQ78cXDjzf3LUP2Kr7tiig87hhXnuzQg008='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"

# My Stack (PRD-REGISTER section 10): "Referrer-Policy: no-referrer for /my
# specifically... the site-wide policy stays as is". Confirmed on the PR 3
# deploy preview: for a path matched by both blocks, Netlify does not send
# two Referrer-Policy values, this narrower block simply REPLACES the wide
# "/*" value, so /my responds with no-referrer alone and every other path
# keeps strict-origin-when-cross-origin. The same replace-not-concatenate
# semantics are why the /embed.html CSP below must be a complete policy.
[[headers]]
  for = "/my"
  [headers.values]
    Referrer-Policy = "no-referrer"
    # Pre-publicity security sweep, 14 Aug: the DENY rules above match the
    # literal request paths "/", "/index.html" and "/x", and the SPA fallback
    # serving index.html for /my does NOT inherit them (headers match on the
    # requested path, not the file served). That left the one page with
    # destructive one-click actions and a passphrase field framable. Denied
    # here, and on /my/ below, mirroring /x.
    X-Frame-Options = "DENY"

[[headers]]
  for = "/my/"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

# Embed mode (BUILD-PLAN 10.11): frame-ancestors is the modern, allow-listed
# replacement for X-Frame-Options, so this is the one page on the whole site
# that may sit inside an iframe, and only an iframe served from Kaipability's
# own site. Confirmed on the PR 3 deploy preview: when two [[headers]] blocks
# set the SAME header name for a path, Netlify does not send both values, the
# later (more specific) block REPLACES the wider one entirely. A bare
# frame-ancestors value here therefore stripped the whole strict CSP off
# embed.html. So this value must be the complete policy: everything the wide
# "/*" rule sends, with frame-ancestors appended. If the "/*" CSP changes,
# change this one to match, keeping the frame-ancestors suffix; the smoke
# suite's hash-drift gate checks the script hashes in both.
[[headers]]
  for = "/embed.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'sha256-XRCkNlfal/u9MDRDFatwZ8fbo9S8jzgsybjnonliY4Q=' 'sha256-tXEPFiTeuQ78cXDjzf3LUP2Kr7tiig87hhXnuzQg008='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors https://kaipability.com https://*.kaipability.com"

# security.txt (RFC 9116, PRD-REGISTER section 10): a real file under
# publish = ".", so the SPA fallback redirect below never reaches it (it
# only ever fires for paths with no matching file, per the note on that
# redirect). This header rule is not load-bearing for that reason, it just
# states the content type explicitly rather than relying on Netlify's
# default guess for an unfamiliar extension.
[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Keep tools.json uncached-ish so a data-only push shows up without a hard refresh.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Old-domain consolidation: tools.airl.io is the primary domain, but Netlify's
# automatic netlify.app-to-primary redirect was observed NOT engaging for this
# site (fresh edge responses served 200 on the subdomain after two deploys with
# primary set, 25 Jul). This explicit host-scoped rule is Netlify's documented
# pattern for the same thing. 301 preserves the path via :splat, and Netlify
# forwards query strings automatically, so every client link ever sent
# (?t=...&client=...) lands intact on the new domain. Must sit before the
# path-only rules below; it matches solely on the old host.
[[redirects]]
  from = "https://kai-freestack.netlify.app/*"
  to = "https://tools.airl.io/:splat"
  status = 301
  force = true

# Working documents are not part of the product. The publish directory is the
# repo root, so without these rules every planning and spec file is served to
# anyone who guesses the path (confirmed live 25 Jul: /PRD.md returned 200).
# force = true is required precisely because the files DO exist; a non-forced
# rule would never fire. Netlify redirect patterns have no suffix wildcard
# (no "/*.md"), so root documents are enumerated one by one. Add a rule here
# whenever a new working document lands in the repo root. What stays public
# from design-system/ is only what the site loads: colors_and_type.css,
# fonts/ and assets/. Runtime surfaces (css/, js/, data/, assets/) are the
# product and stay served.
[[redirects]]
  from = "/BUILD-LOOP.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/BUILD-PLAN.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/DESIGN-SYSTEM.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/HOW-TO.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/PRD-REGISTER.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/PRD.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/TODO.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/design-system/BRAND_BRIEF.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/design-system/README.md"
  to = "/404.html"
  status = 404
