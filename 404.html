<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f3ec; color: #1a1a1a; font-family: Georgia, 'Times New Roman', serif; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { margin: 0.25rem 0; color: #555; }
    a { color: #7a1f1f; }
    @media (prefers-color-scheme: dark) {
      body { background: #171310; color: #f0ebe2; }
      p { color: #b8b0a4; }
      a { color: #e0938c; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>There is nothing at this address.</p>
    <p><a href="/">Back to the directory</a></p>
  </main>
</body>
</html>
